name: Validate PBIR Visuals

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate generated PBIR visuals
        shell: pwsh
        run: .\scripts\Validate-PBIRVisuals.ps1
