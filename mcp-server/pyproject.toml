[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-visuales-avanzado"
version = "0.1.0"
description = "Standalone MCP server for advanced Power BI PBIR visualization workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Vicente Antonio Juan Magallanes" }
]
dependencies = [
  "click>=8.1.0",
  "mcp[cli]>=1.27.0",
]

[project.optional-dependencies]
preview = [
  "websockets>=12.0",
]
reload = [
  "pywin32>=306",
]
full = [
  "websockets>=12.0",
  "pywin32>=306",
]

[project.scripts]
mcp-visuales-avanzado = "mcp_visuales_avanzado.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_visuales_avanzado = ["py.typed"]
"mcp_visuales_avanzado.templates.visuals" = ["*.json"]
